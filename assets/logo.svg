<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Rounded Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#fecaca" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Pipe Joint Plumbing System -->
  <!-- Horizontal Main Pipe Body -->
  <path d="M72 216 H440 V296 H72 Z" fill="url(#metalGrad)" filter="url(#shadow)"/>
  <!-- Left Pipe Collar -->
  <rect x="72" y="196" width="38" height="120" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Right Pipe Collar -->
  <rect x="402" y="196" width="38" height="120" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Center Vertical Pipe Fitting -->
  <path d="M214 130 H298 V220 H214 Z" fill="url(#metalGrad)"/>
  <!-- Top Pipe Collar -->
  <rect x="198" y="110" width="116" height="34" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Pipe Seams -->
  <rect x="180" y="216" width="14" height="80" rx="4" fill="#94a3b8"/>
  <rect x="318" y="216" width="14" height="80" rx="4" fill="#94a3b8"/>

  <!-- Water Pulse Burst Rings -->
  <circle cx="256" cy="270" r="135" fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="256" cy="270" r="105" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Emergency Water Droplet Emblem -->
  <path d="M256 160 C256 160 348 274 348 334 C348 384.8 306.8 426 256 426 C205.2 426 164 384.8 164 334 C164 274 256 160 256 160 Z" fill="url(#waterGrad)" filter="url(#shadow)"/>
  
  <!-- Droplet Gloss Highlights -->
  <path d="M218 296 C206 320 206 350 216 370 C212 360 212 330 224 306 C230 294 238 284 238 284 C238 284 226 282 218 296 Z" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="292" cy="300" r="14" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Rapid Shutoff & Pipe Wrench Cross -->
  <g transform="translate(300, 300)">
    <circle cx="80" cy="80" r="64" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="80" cy="80" r="54" fill="#dc2626"/>
    <!-- Wrench Tool -->
    <path d="M60 100 L100 60" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M52 108 L68 92" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <!-- Faucet/Nut symbol -->
    <circle cx="94" cy="66" r="10" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
